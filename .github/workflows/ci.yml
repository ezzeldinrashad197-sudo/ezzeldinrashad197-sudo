name: StructuSight Production Certification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  certify:
    name: Production Hardening Certification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java Runtime for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Project Dependencies (Strict npm ci)
        run: npm ci

      - name: 'Gate 1: Type Integrity & Syntax Lint (tsc --noEmit)'
        run: npm run lint

      - name: 'Gate 2: Architecture & SSOT Compliance Audit'
        run: npm run architecture-audit

      - name: 'Gate 3: Unit Tests, Mathematical Invariants & Stress Benchmarks'
        run: npm run test

      - name: 'Gate 4: Zero-Trust Authentication, Tenant Isolation & Negative Auth Tests'
        run: npm run test:auth

      - name: 'Gate 5: Real Firestore Security Rules Runtime Verification (Firebase Emulator)'
        run: npx firebase emulators:exec --only firestore "npm run test:firestore-runtime"

      - name: 'Gate 6: Sequence Population Integrity & Observation-Only Audit'
        run: npm run test:sequence

      - name: 'Gate 7: Cross-Layer Overdue Calculations Audit'
        run: npm run test:overdue

      - name: 'Gate 8: RFI Invariant Total Regression Suite'
        run: npm run test:rfi

      - name: 'Gate 9: Universal Source Identity & Ingestion Classification Audit'
        run: npm run test:usi

      - name: 'Gate 10: Structural & Trade Classification Matrix Invariants'
        run: npm run test:str-matrix

      - name: 'Gate 11: WIR-STR Real-World Registry E2E Verification'
        run: npm run test:wir-str

      - name: 'Gate 12: L99 Identity Equality & Independent Provenance Audits'
        run: npm run test:l99

      - name: 'Gate 13: Lifecycle Provenance & History Traceability Suite'
        run: npm run test:lifecycle

      - name: 'Gate 14: Presentation & Export Matrix Audit (PPTX)'
        run: npm run test:pptx

      - name: 'Gate 15: Chapter 16 / ER-013 Backend Metrics Calculation Engine'
        run: npm run test:er013

      - name: 'Gate 16: End-to-End Integration & Golden Dataset Parity (0 Variance)'
        run: npm run run-integration-tests

      - name: 'Gate 17: Forensic E2E Regression & Revision Invariance Suite'
        run: npm run test:forensic

      - name: 'Gate 18: Comprehensive Production Benchmark Regression Harness'
        run: npm run test:regression-suite

      - name: 'Gate 19: Generate Authoritative Audit Evidence Report'
        run: npm run generate-evidence-report

      - name: 'Gate 20: Production Build & Asset Verification'
        run: npm run build
